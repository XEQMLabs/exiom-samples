<!doctype html><html><head><meta charset="utf-8"><title>EXIOM Wallet Ownership — sample</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;line-height:1.5}
button{font:inherit;padding:9px 14px;border-radius:8px;border:none;background:#0d7d88;color:#fff;cursor:pointer}
pre{background:#0e1620;color:#d6e2ea;padding:14px;border-radius:10px;overflow:auto;font-size:13px}
.ok{color:#1f9d57;font-weight:600}.no{color:#c2453b;font-weight:600}</style></head><body>
<h1>Prove wallet ownership</h1>
<p>Connect MetaMask, sign a one-time challenge, and the backend verifies it with EXIOM — binding
your Ethereum address to your DID. Your key never leaves your wallet.</p>
<p><button onclick="run()">Connect &amp; prove ownership</button></p>
<p id="verdict"></p><pre id="out">(result appears here)</pre>
<script>
async function run(){
  const v=document.getElementById('verdict'), out=document.getElementById('out'); v.textContent='…'; out.textContent=''
  if(!window.ethereum){v.innerHTML='<span class="no">No MetaMask found</span>';return}
  const [address]=await window.ethereum.request({method:'eth_requestAccounts'})
  // 1) ask our backend for a challenge
  let r=await fetch('/api/challenge',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address})})
  const ch=await r.json()
  if(!ch.challenge_id){v.innerHTML='<span class="no">challenge failed</span>';out.textContent=JSON.stringify(ch,null,2);return}
  // 2) sign the exact challenge message with the wallet
  const signature=await window.ethereum.request({method:'personal_sign',params:[ch.message,address]})
  // 3) verify through our backend
  r=await fetch('/api/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({challenge_id:ch.challenge_id,signature})})
  const res=await r.json()
  v.innerHTML=res.verified?'<span class="ok">VERIFIED</span> — '+res.address+' bound':'<span class="no">FAILED</span> — '+(res.detail||res.reason||'')
  out.textContent=JSON.stringify(res,null,2)
}
</script></body></html>
