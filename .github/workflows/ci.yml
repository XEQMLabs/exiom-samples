name: samples-ci
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Public endpoints must always answer — no key needed.
      - name: Public endpoints reachable
        run: |
          set -e
          base="https://api.exiom.network"
          for p in /health /v1/contracts /v1/jurisdictions /v1/verification/capability /v1/verification/policies; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$p")
            echo "$code $p"; test "$code" = "200"
          done
      # Authenticated flows run only when a key secret is configured.
      - name: Authenticated smoke (optional)
        if: ${{ secrets.EXIOM_API_KEY != '' }}
        env:
          EXIOM_API_KEY: ${{ secrets.EXIOM_API_KEY }}
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "X-XEQM-Api-Key: $EXIOM_API_KEY" https://api.exiom.network/v1/tier)
          echo "tier: $code"; test "$code" = "200"
